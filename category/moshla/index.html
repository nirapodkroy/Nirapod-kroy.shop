    <script>
      (function() {
        var loaded = false;
        function loadFallback() {
          if (loaded) return;
          var root = document.getElementById('root');
          if (root && root.firstElementChild) return;
          loaded = true;
          var ver = Date.now().toString(36);
          if (!document.getElementById('nirapod-css-fallback')) {
            var link = document.createElement('link');
            link.id = 'nirapod-css-fallback';
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = './assets/index.css?v=' + ver;
            document.head.appendChild(link);
          }
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js?v=' + ver;
          document.body.appendChild(script);
        }

        window.addEventListener('error', function(e) {
          if (e && ((e.filename && e.filename.indexOf('main.tsx') !== -1) || (e.target && e.target.src && e.target.src.indexOf('main.tsx') !== -1))) {
            loadFallback();
          }
